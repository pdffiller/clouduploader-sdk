namespace: Tests
support_namespace: Support
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/Support
    envs: tests/_envs
actor_suffix: Tester
extensions:
    enabled:
        - Codeception\Extension\RunFailed

coverage:
    enabled: true
    include:
        - Fabric/*
        - HttpReceiver/*
        - Interfaces/*
        - UploadModels/*
